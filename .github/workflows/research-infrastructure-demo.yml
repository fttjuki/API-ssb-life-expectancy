name: Research infrastructure demo

on:
  push:
    paths:
      - "research-infrastructure-demo/**"
      - ".github/workflows/research-infrastructure-demo.yml"
  pull_request:
    paths:
      - "research-infrastructure-demo/**"
      - ".github/workflows/research-infrastructure-demo.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: research-infrastructure-demo
        run: python -m unittest discover -s tests -v
